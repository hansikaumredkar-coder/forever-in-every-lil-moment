<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever in Every Lil Moment</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars">✦</div>
    <div class="stars star-two">✧</div>
    <div class="stars star-three">⋆</div>

    <main class="welcome-screen">

        <p class="tiny-text">A LITTLE BIRTHDAY SURPRISE</p>

        <h1>
            Forever in<br>
            Every Lil Moment
        </h1>

        <p class="subtitle">
            For my favorite person, on their special day.
        </p>

        <div class="gift-box" id="giftBox">
            <div class="gift-lid"></div>
            <div class="gift-body">♡</div>
            <div class="gift-ribbon"></div>
        </div>

        <p class="gift-caption">
            A little gift, made with lots of love.
        </p>

        <button id="openGift">
            Open your surprise ♡
        </button>

        <p class="footer-text">
            Made with love, just for you.
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
